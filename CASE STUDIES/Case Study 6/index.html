```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript String Operations</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            padding: 20px;

            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            align-items: start;
        }

        h1 {
            grid-column: 1 / -1;
            text-align: left;
            color: #667eea;
            margin-bottom: 5px;
            font-size: 2em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 8px;
        }

        .section {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 5px solid #667eea;
        }

        .section:last-child {
            grid-column: 1 / -1;
        }

        .section h2 {
            color: #764ba2;
            margin-bottom: 12px;
            font-size: 1.35em;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #333;
            font-weight: 600;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 12px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            margin-right: 7px;
            margin-bottom: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .result {
            margin-top: 12px;
            padding: 12px;
            background: #e7f3ff;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            display: none;
            word-wrap: break-word;
        }

        .result.show {
            display: block;
            animation: fadeIn 0.5s;
        }

        .result strong {
            color: #764ba2;
        }

        .string-operations {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 12px;
        }

        .operation-box {
            background: white;
            padding: 12px;
            min-height: 90px;
            border-radius: 8px;
            border: 2px solid #ddd;
        }

        .operation-box h3 {
            color: #667eea;
            margin-bottom: 8px;
            font-size: 1em;
        }

        .operation-box p {
            white-space: pre-wrap;
            word-break: break-word;
            color: #333;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .stats {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .stat-item {
            background: white;
            padding: 10px 15px;
            border-radius: 8px;
            border: 2px solid #667eea;
            text-align: center;
            flex: 1;
            min-width: 100px;
        }

        .stat-item .number {
            font-size: 1.7em;
            font-weight: bold;
            color: #764ba2;
        }

        .stat-item .label {
            color: #666;
            font-size: 0.85em;
        }

        @media (max-width: 800px) {
            .container {
                grid-template-columns: 1fr;
            }

            h1,
            .section:last-child {
                grid-column: auto;
            }

            .string-operations {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🔤 JavaScript String Operations</h1>

        <div class="section">
            <h2>1. Reverse a String</h2>

            <label for="inputString">Enter a string:</label>

            <input
                type="text"
                id="inputString"
                placeholder="Type something to reverse..."
            >

            <button onclick="reverseString()">Reverse String</button>
            <button onclick="clearReverse()">Clear</button>

            <div id="reverseResult" class="result">
                <strong>Reversed String:</strong>
                <span id="reversedText"></span>
            </div>
        </div>

        <div class="section">
            <h2>2. Count Vowels in a Paragraph</h2>

            <label for="paragraph">Enter a paragraph:</label>

            <textarea
                id="paragraph"
                placeholder="Type or paste your paragraph here..."
            ></textarea>

            <button onclick="countVowels()">Count Vowels</button>
            <button onclick="clearVowels()">Clear</button>

            <div id="vowelResult" class="result">

                <div class="stats">
                    <div class="stat-item">
                        <div class="number" id="totalVowels">0</div>
                        <div class="label">Total Vowels</div>
                    </div>

                    <div class="stat-item">
                        <div class="number" id="totalConsonants">0</div>
                        <div class="label">Consonants</div>
                    </div>

                    <div class="stat-item">
                        <div class="number" id="totalChars">0</div>
                        <div class="label">Total Characters</div>
                    </div>
                </div>

                <div style="margin-top: 12px;">
                    <strong>Vowel Details:</strong>
                    <br>
                    <span id="vowelDetails"></span>
                </div>
            </div>
        </div>

        <div class="section">
            <h2>3. String Operations Demo</h2>

            <label for="demoString">Enter a string for operations:</label>

            <input
                type="text"
                id="demoString"
                placeholder="Enter text to demonstrate operations..."
            >

            <button onclick="performOperations()">
                Perform Operations
            </button>

            <div id="operationsResult" class="result">

                <div class="string-operations">

                    <div class="operation-box">
                        <h3>substring(0, 5)</h3>
                        <p id="substringResult">-</p>
                    </div>

                    <div class="operation-box">
                        <h3>indexOf()</h3>
                        <p id="indexOfResult">-</p>
                    </div>

                    <div class="operation-box">
                        <h3>split()</h3>
                        <p id="splitResult">-</p>
                    </div>

                    <div class="operation-box">
                        <h3>replace()</h3>
                        <p id="replaceResult">-</p>
                    </div>

                </div>
            </div>
        </div>

    </div>

    <script>
        function reverseString() {
            const input = document.getElementById("inputString").value;

            if (input.trim() === "") {
                alert("Please enter a string first!");
                return;
            }

            const reversed = input
                .split("")
                .reverse()
                .join("");

            document.getElementById("reversedText").textContent = reversed;

            document
                .getElementById("reverseResult")
                .classList.add("show");
        }

        function clearReverse() {
            document.getElementById("inputString").value = "";

            document
                .getElementById("reverseResult")
                .classList.remove("show");
        }

        function countVowels() {
            const text = document.getElementById("paragraph").value;

            if (text.trim() === "") {
                alert("Please enter a paragraph first!");
                return;
            }

            const vowels =
                text.match(/[aeiouAEIOU]/g) || [];

            const consonants =
                text.match(
                    /[bcdfghjklmnpqrstvwxyzBCDFGHJKLMNPQRSTVWXYZ]/g
                ) || [];

            const totalChars =
                text.replace(/\s/g, "").length;

            document.getElementById("totalVowels").textContent =
                vowels.length;

            document.getElementById("totalConsonants").textContent =
                consonants.length;

            document.getElementById("totalChars").textContent =
                totalChars;

            const vowelCount = {
                a: 0,
                e: 0,
                i: 0,
                o: 0,
                u: 0
            };

            text.toLowerCase().split("").forEach(function (char) {
                if (Object.prototype.hasOwnProperty.call(vowelCount, char)) {
                    vowelCount[char]++;
                }
            });

            let details =
                '<ul style="margin-top: 8px; padding-left: 20px;">';

            for (let vowel in vowelCount) {
                details +=
                    "<li><strong>" +
                    vowel.toUpperCase() +
                    ":</strong> " +
                    vowelCount[vowel] +
                    " times</li>";
            }

            details += "</ul>";

            document.getElementById("vowelDetails").innerHTML =
                details;

            document
                .getElementById("vowelResult")
                .classList.add("show");
        }

        function clearVowels() {
            document.getElementById("paragraph").value = "";

            document
                .getElementById("vowelResult")
                .classList.remove("show");
        }

        function performOperations() {
            const str =
                document.getElementById("demoString").value;

            if (str.trim() === "") {
                alert("Please enter a string first!");
                return;
            }

            const substringValue =
                str.substring(0, 5);

            document.getElementById("substringResult").textContent =
                substringValue;

            const spaceIndex =
                str.indexOf(" ");

            document.getElementById("indexOfResult").textContent =
                spaceIndex !== -1
                    ? "First space at position: " + spaceIndex
                    : "No space found";

            const words =
                str.split(" ");

            document.getElementById("splitResult").textContent =
                "Words: " +
                words.length +
                "\n[" +
                words.join(", ") +
                "]";

            const replaced =
                str.replace(/\s/g, "-");

            document.getElementById("replaceResult").textContent =
                "Spaces to -: " +
                replaced;

            document
                .getElementById("operationsResult")
                .classList.add("show");
        }
    </script>

</body>
</html>
